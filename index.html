<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>我们家点菜</title>
<style>
  :root{--main:#ff6b35;--bg:#f6f6f6;--text:#222;--sub:#888}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:90px}
  header{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
  header h1{font-size:18px;margin:0}
  .btn{border:0;border-radius:16px;padding:6px 14px;font-size:14px;cursor:pointer;background:#f0f0f0;color:var(--text)}
  .btn.primary{background:var(--main);color:#fff}
  .btn.danger{background:#ff4d4f;color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  @media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .pic{width:100%;aspect-ratio:1/1;background:#fde8df;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
  .pic img{width:100%;height:100%;object-fit:cover}
  .info{display:flex;align-items:center;justify-content:space-between;padding:10px}
  .name{font-size:15px;font-weight:600;word-break:break-all}
  .ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .round{width:28px;height:28px;border-radius:50%;border:0;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .round.add{background:var(--main);color:#fff}
  .round.minus{background:#fff;color:var(--main);border:1px solid var(--main)}
  .qty{min-width:14px;text-align:center;font-size:15px}
  .del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,77,79,.95);color:#fff;font-size:16px;display:none;cursor:pointer}
  .manage .del{display:block}
  .manage .ctrl{display:none}
  .empty{text-align:center;color:var(--sub);padding:80px 20px;grid-column:1/-1;line-height:1.8}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#333;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
  .bar .left{display:flex;align-items:center;gap:10px;cursor:pointer}
  .badge{background:var(--main);border-radius:10px;padding:0 8px;font-size:13px;line-height:20px;min-width:20px;text-align:center}
  .fab{position:fixed;right:18px;bottom:84px;width:52px;height:52px;border-radius:50%;background:var(--main);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px rgba(255,107,53,.5);z-index:15;display:none;cursor:pointer}
  .manage .fab{display:block}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .mask.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:16px;max-height:80vh;overflow:auto}
  .sheet h2{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
  .row .thumb{width:44px;height:44px;border-radius:8px;background:#fde8df;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .row .thumb img{width:100%;height:100%;object-fit:cover}
  .row .n{flex:1;font-size:15px}
  label.field{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
  .upload{width:120px;height:120px;border:2px dashed #ccc;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;overflow:hidden;cursor:pointer;text-align:center}
  .upload img{width:100%;height:100%;object-fit:cover}
  .actions{display:flex;gap:10px;margin-top:18px}
  .actions .btn{flex:1;padding:10px;border-radius:10px;font-size:16px}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;display:none}
</style>
</head>
<body>
<header>
  <h1>🍚 今天吃什么</h1>
  <button class="btn" id="manageBtn">管理菜品</button>
</header>

<div class="grid" id="grid"></div>
<button class="fab" id="fab">＋</button>

<div class="bar">
  <div class="left" id="openCart">
    <span>🛒 已点</span><span class="badge" id="badge">0</span>
  </div>
  <button class="btn primary" id="openCart2">查看菜单</button>
</div>

<!-- 已点菜单 -->
<div class="mask" id="cartMask">
  <div class="sheet">
    <h2>已点的菜 <button class="btn" id="clearCart">清空</button></h2>
    <div id="cartList"></div>
    <div class="actions"><button class="btn primary" id="closeCart">继续点</button></div>
  </div>
</div>

<!-- 添加菜品 -->
<div class="mask" id="addMask">
  <div class="sheet">
    <h2>添加菜品</h2>
    <label class="field">菜名</label>
    <input type="text" id="dishName" maxlength="20" placeholder="例如：红烧肉">
    <label class="field">菜品图片（可选）</label>
    <label class="upload" id="uploadBox">
      <span>点击上传<br>/ 拍照</span>
      <input type="file" id="dishFile" accept="image/*" hidden>
    </label>
    <div class="actions">
      <button class="btn" id="cancelAdd">取消</button>
      <button class="btn primary" id="saveAdd">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY_DISHES = 'diancai_dishes_v1';
const KEY_CART = 'diancai_cart_v1';
const $ = id => document.getElementById(id);

function load(key, def){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? def; }catch(e){ return def; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast('存储空间不足，请删除一些图片'); return false; }
}

let dishes = load(KEY_DISHES, null);
if(!dishes){
  dishes = [
    {id:1, name:'番茄炒蛋', img:''},
    {id:2, name:'红烧肉', img:''},
    {id:3, name:'清炒时蔬', img:''},
    {id:4, name:'紫菜蛋花汤', img:''}
  ];
  save(KEY_DISHES, dishes);
}
let cart = load(KEY_CART, {}); // {dishId: qty}
let manage = false;
let newImg = '';

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', 1800);
}
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  document.body.classList.toggle('manage', manage);
  $('manageBtn').textContent = manage ? '完成' : '管理菜品';
  $('manageBtn').className = manage ? 'btn primary' : 'btn';
  const g = $('grid');
  if(!dishes.length){
    g.innerHTML = '<div class="empty">还没有菜品<br>点右上角「管理菜品」，再点＋添加</div>';
  }else{
    g.innerHTML = dishes.map(d=>{
      const q = cart[d.id]||0;
      return `<div class="card">
        <div class="pic">${d.img?`<img src="${d.img}">`:'🍽️'}</div>
        <button class="del" data-del="${d.id}">×</button>
        <div class="info">
          <span class="name">${esc(d.name)}</span>
          <span class="ctrl">
            ${q?`<button class="round minus" data-minus="${d.id}">−</button><span class="qty">${q}</span>`:''}
            <button class="round add" data-add="${d.id}">+</button>
          </span>
        </div>
      </div>`;
    }).join('');
  }
  const total = Object.values(cart).reduce((a,b)=>a+b,0);
  $('badge').textContent = total;
}

function renderCart(){
  const items = dishes.filter(d=>cart[d.id]);
  $('cartList').innerHTML = items.length ? items.map(d=>`
    <div class="row">
      <div class="thumb">${d.img?`<img src="${d.img}">`:'🍽️'}</div>
      <div class="n">${esc(d.name)}</div>
      <span class="ctrl" style="display:flex">
        <button class="round minus" data-cminus="${d.id}">−</button>
        <span class="qty">${cart[d.id]}</span>
        <button class="round add" data-cadd="${d.id}">+</button>
      </span>
    </div>`).join('') : '<div class="empty" style="padding:30px 0">还没点菜哦</div>';
}

$('grid').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.add){ cart[d.add] = (cart[d.add]||0)+1; save(KEY_CART, cart); render(); }
  else if(d.minus){ cart[d.minus]--; if(cart[d.minus]<=0) delete cart[d.minus]; save(KEY_CART, cart); render(); }
  else if(d.del){
    const dish = dishes.find(x=>x.id==d.del);
    if(confirm(`确定删除「${dish.name}」吗？`)){
      dishes = dishes.filter(x=>x.id!=d.del); delete cart[d.del];
      save(KEY_DISHES, dishes); save(KEY_CART, cart); render();
    }
  }
});

$('cartList').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.cadd) cart[d.cadd]++;
  else if(d.cminus){ cart[d.cminus]--; if(cart[d.cminus]<=0) delete cart[d.cminus]; }
  save(KEY_CART, cart); render(); renderCart();
});

function openCart(){ renderCart(); $('cartMask').classList.add('show'); }
$('openCart').onclick = openCart;
$('openCart2').onclick = openCart;
$('closeCart').onclick = ()=>$('cartMask').classList.remove('show');
$('cartMask').onclick = e=>{ if(e.target===$('cartMask')) $('cartMask').classList.remove('show'); };
$('clearCart').onclick = ()=>{
  if(!Object.keys(cart).length) return;
  if(confirm('清空已点的菜？')){ cart = {}; save(KEY_CART, cart); render(); renderCart(); }
};

$('manageBtn').onclick = ()=>{ manage = !manage; render(); };

// 添加菜品
function openAdd(){
  newImg = ''; $('dishName').value = '';
  $('uploadBox').innerHTML = '<span>点击上传<br>/ 拍照</span><input type="file" id="dishFile" accept="image/*" hidden>';
  bindFile();
  $('addMask').classList.add('show');
}
$('fab').onclick = openAdd;
$('cancelAdd').onclick = ()=>$('addMask').classList.remove('show');
$('addMask').onclick = e=>{ if(e.target===$('addMask')) $('addMask').classList.remove('show'); };

function bindFile(){
  $('dishFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    compress(f).then(url=>{
      newImg = url;
      $('uploadBox').innerHTML = `<img src="${url}"><input type="file" id="dishFile" accept="image/*" hidden>`;
      bindFile();
    }).catch(()=>toast('图片读取失败'));
  };
}
// 压缩图片到最长边 600px，减小存储占用
function compress(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const max = 600, r = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

$('saveAdd').onclick = ()=>{
  const name = $('dishName').value.trim();
  if(!name){ toast('请输入菜名'); return; }
  dishes.push({id: Date.now(), name, img: newImg});
  if(save(KEY_DISHES, dishes)){
    $('addMask').classList.remove('show'); render(); toast('已添加');
  }else{
    dishes.pop();
  }
};

render();
</script>
</body>
</html>
